<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>AEMT video</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}#msg{color:#9aa;font:16px system-ui,sans-serif;padding:24px}</style>
</head>
<body>
<script>
// Plays one YouTube video filling this window. Used by the AEMT presenter slide window: slides.html?...  -> player?v=VIDEO_ID&t=START_SECONDS
const p = new URLSearchParams(location.search);
const id = (p.get('v') || '').replace(/[^A-Za-z0-9_-]/g, '');
const start = parseInt(p.get('t') || '0', 10) || 0;
if (id) {
  const f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  f.allowFullscreen = true;
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&modestbranding=1&playsinline=1' + (start ? '&start=' + start : '');
  document.body.appendChild(f);
} else {
  document.body.innerHTML = '<div id="msg">No video selected.</div>';
}
</script>
</body>
</html>
